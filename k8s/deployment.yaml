apiVersion: v1
kind: Secret
metadata:
  name: ty-multiverse-frontend-secrets
type: Opaque
stringData:
  PUBLIC_DECKOFCARDS_URL: "${{ secrets.PUBLIC_DECKOFCARDS_URL }}"
  PUBLIC_TYMB_URL: "${{ secrets.PUBLIC_TYMB_URL }}"
  PUBLIC_SSO_URL: "${{ secrets.PUBLIC_SSO_URL }}"
  PUBLIC_FRONTEND_URL: "${{ secrets.PUBLIC_FRONTEND_URL }}"
  PUBLIC_PEOPLE_IMAGE_URL: "${{ secrets.PUBLIC_PEOPLE_IMAGE_URL }}"
  PUBLIC_CLIENT_ID: "${{ secrets.PUBLIC_CLIENT_ID }}"
  PUBLIC_REALM: "${{ secrets.PUBLIC_REALM }}"
  PUBLIC_API_BASE_URL: "${{ secrets.PUBLIC_API_BASE_URL }}"
  PUBLIC_TYMG_URL: "${{ secrets.PUBLIC_TYMG_URL }}"
  MARKET_INTERNAL_SECRET: "${{ secrets.MARKET_INTERNAL_SECRET }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ty-multiverse-frontend
  labels:
    app.kubernetes.io/name: ty-multiverse-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # 滾動更新：新 pod readiness 通過後才關舊 pod，部署期間不中斷。
  # 2026-11-08 Recreate 讓舊 pod 先停、新 pod 卡 CreateContainerError，全站 503 約一小時。
  # Jenkins 以 kubectl patch 強制套用同樣設定（Jenkinsfile 的 Deploy stage）。
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ty-multiverse-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ty-multiverse-frontend
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - jenkins
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: ty-multiverse-frontend
        image: papakao/ty-multiverse-frontend:latest
        ports:
        - containerPort: 4321
        readinessProbe:
          httpGet:
            path: /robots.txt
            port: 4321
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: "30m"
            memory: "256Mi"
          limits:
            cpu: "200m"
            memory: "512Mi"
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                echo "Pod started, triggering initial article sync..."
                sleep 10  # 等待應用程式完全啟動
                curl -X POST \
                  -H "Content-Type: application/json" \
                  -d '{"action": "sync"}' \
                  "http://localhost:4321/md-exporter" || echo "Initial sync failed, will retry via CronJob"
        env:
        - name: PUBLIC_DECKOFCARDS_URL
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-frontend-secrets
              key: PUBLIC_DECKOFCARDS_URL
        - name: PUBLIC_TYMB_URL
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-frontend-secrets
              key: PUBLIC_TYMB_URL
        - name: PUBLIC_SSO_URL
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-frontend-secrets
              key: PUBLIC_SSO_URL
        - name: PUBLIC_FRONTEND_URL
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-frontend-secrets
              key: PUBLIC_FRONTEND_URL
        - name: PUBLIC_PEOPLE_IMAGE_URL
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-frontend-secrets
              key: PUBLIC_PEOPLE_IMAGE_URL
        - name: PUBLIC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-frontend-secrets
              key: PUBLIC_CLIENT_ID
        - name: PUBLIC_REALM
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-frontend-secrets
              key: PUBLIC_REALM
        - name: PUBLIC_API_BASE_URL
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-frontend-secrets
              key: PUBLIC_API_BASE_URL
        - name: PUBLIC_TYMG_URL
          valueFrom:
            secretKeyRef:
              name: ty-multiverse-frontend-secrets
              key: PUBLIC_TYMG_URL
        - name: MARKET_INTERNAL_SECRET
          valueFrom:
            secretKeyRef:
              name: market-internal-secret
              key: MARKET_INTERNAL_SECRET
        - name: MAYA_SAWA_INTERNAL_URL
          value: "http://maya-sawa/maya-sawa"
---
apiVersion: v1
kind: Service
metadata:
  name: ty-multiverse-frontend
  labels:
    app.kubernetes.io/name: ty-multiverse-frontend
  namespace: default
spec:
  selector:
    app.kubernetes.io/name: ty-multiverse-frontend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 4321
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ty-multiverse-frontend-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - tymultiverse.cc
    # Certificate is managed in peoplesystem-terraform-oke/tymultiverse-domain/certificate.yaml
    secretName: tymultiverse-cc-tls
  rules:
  - host: tymultiverse.cc
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ty-multiverse-frontend
            port:
              number: 80
---
# The site used to live under /tymultiverse on the old host. Those URLs still reach the
# frontend, whose middleware (src/scripts/site/legacyRedirect.ts) answers 301 to the same
# page at the root of tymultiverse.cc. On the new host "/" above already covers /tymultiverse.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ty-multiverse-frontend-legacy-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-production
    cert-manager.io/certificate-name: peoplesystem-tls
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - peoplesystem.tatdvsonorth.com
    secretName: peoplesystem-tls
  rules:
  - host: peoplesystem.tatdvsonorth.com
    http:
      paths:
      - path: /tymultiverse
        pathType: Prefix
        backend:
          service:
            name: ty-multiverse-frontend
            port:
              number: 80
      # Prefix, not Exact: in regex mode an Exact "/" does not replace the default
      # backend location, so the old root would 404 instead of redirecting.
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ty-multiverse-frontend
            port:
              number: 80
